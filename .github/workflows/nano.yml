name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sawone-security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run SawOne Agentic Scanner
        uses: hackin2minutes-oss/sawone-agentic-action@ba541ccc7f4d2939e1b6ec8c74d3eb5d19931c36 # v1
        # zizmor: ignore[unpinned-uses]
        with:
          severity: HIGH,CRITICAL
          enforce: false
          languages: en,ar

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sawone-agentic-reports
          path: sawone-agentic-reports/
          overwrite: true
