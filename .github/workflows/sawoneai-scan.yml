name: SawoneAI scan

on:
  workflow_dispatch:
  push:
    branches: [sawoneai-scan-run]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dify
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      - name: Install the scanner
        run: python -m pip install sawoneai==0.0.2

      - name: Scan dify
        run: python -m sawoneai scan . --format sarif --output sawoneai.sarif

      - name: Upload findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: sawoneai.sarif
          category: sawoneai

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sawoneai-report
          path: sawoneai.sarif
